# ============================================================
# OneServe 服务注册配置（task-003）——SPEC §3.3「配置驱动＋少量胶水」的第一次真实化
# 本文件即 SPEC §3.3 YAML 示例落成的真配置：注册一个服务＝填一份声明式配置。
# KV 执行器（service/app/kv_executor.py）按此配置驱动，不含任何服务名硬编码。
#
# 服务注册（卡4 ADR-0008 §Decision.2）：注册表索引＝service_id 单键（服务修订号已删）；
# 同 service_id 再发布＝原地覆盖更新（发布史见条目 trace.history，不追加条目）。
# 「版本」只剩两类（门槛稿 §〇三分法）：URL /v1/ API 大版本与表数据版本
# （backend.load.version/Redis {version} 插槽＝YYYYMMDD tabver，均不经注册表）。
# 数据源类型（TASK-M2-3 / AC-1）：backend.source = redis | hbase，缺省 redis
# （向后兼容，存量服务零改动）；hbase 型带 backend.hbase{table,cf,key_type}。
#   · 多列族扩展位（TASK-M2-7-a，维护者 2026-09-23 口径）：backend.hbase.cf 契约允许
#     字符串（本阶段单列族）或字符串列表（未来「rowkey＝key、其余大量列族＝字段」
#     的扩展位）。本阶段只实现单列族语义：cf 登记多个列族时执行器启动即拒（不做
#     静默取首个）；多列族按列族分组投影归 M2-4 之后，不改本节现有注册条目结构。
# 字段空间（TASK-M2-3.8 修复）：field_space = wide297 | news | proxy——
#   schema 漂移判定只对 wide297（引用字段须真实存在于 sync/schema_usr_label_wide_297.csv）；
#   news（tags:news 独立键空间）与 proxy（B 型整体透传，无字段投影语义）不参与宽表漂移。
#   TODO(卡2): 297 宽表字典换源为表级 schema 元数据（装载副产品）；CSV 缓删至卡2 交接（卡5 2026-09-30）。
#   缺省 wide297（向后兼容：存量单域服务零改动，防漏判）。
# 目录模板属性：条目可带 update_frequency（表数据装载节奏事实——现役表口径＝
#   每日 T+1 批量直写 HBase、次日 06:00 前放数；平台按版本装载，无固定 cron）与
#   owner（责任主体——示例口径＝平台运营组，占位真值，接入正式工单系统后订正）。
#   取不到实值如实「未标注」。两属性经 /v1/portal/catalog 下发、目录卡展示；
#   发布重发重建条目时从前条目继承（ops_config.publish_service 保持逻辑，
#   「重建丢 desc」边界同款收口）。
# ============================================================
services:    # 2026-09-29 维护者: all services offline for mainline focus; code and flow assets kept
  - name: 用户资产标签查询
    route: /v1/svc/usr-asset-tag
