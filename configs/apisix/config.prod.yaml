# OneServe 网关配置·生产隔离栈（compose.prod.yml 专用；本文件＝渲染产物勿手改）
# 由 scripts/config_twin.py 从 configs/apisix/config.yaml（dev 真源）渲染生成——
# 改 dev 网关配置后重跑 `python3 scripts/config_twin.py --write` 再生本文件
# （镜像生产化 1b 批·词条⑤ config twin 同步；--check 挂 tests/test_config_twin.py）。
# 与 dev 的唯一语义差异＝Admin ACL 网段 172.28.0.0/16→172.30.0.0/16（prod 专属网
# oneserve-prod-net，与 dev 172.28、m26 验收 172.29 错开）；其余完全一致。
# 真部署换密＋APISIX_ADMIN_KEY 走 secret 注入（1b 批）。
deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  etcd:
    host:
      - http://oneserve-etcd:2379
    prefix: /apisix
  admin:
    admin_key:
      - name: admin
        key: ${{APISIX_ADMIN_KEY}}   # env 展开（APISIX 原生支持，2026-10-20 隔离实证：正确key=200/错key=401）；真值在 .env（9180 不发布宿主机）
        role: admin
    allow_admin:                      # 9180 未发布宿主机端口，ACL 只需覆盖内网来源
      - 127.0.0.1
      - 172.30.0.0/16                 # oneserve-prod-net 网段（service 容器跑 init_routes.py 调 Admin API）
      - 192.168.65.0/24               # Docker Desktop 宿主机网关段（POC 实测源 IP，留作直调兜底）

apisix:
  node_listen:
    - 9080
