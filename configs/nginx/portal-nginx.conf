# OneServe 门户 nginx 站点配置（v4：随包内置，替代镜像默认 conf.d/default.conf）
# 非 root 口径（镜像生产化 1b 批·词条②，2026-10-21）：容器以 nginx-unprivileged
# 基镜像 uid 101 运行，监听口 8080/8443（>1024 免特权免 setcap）；宿主映射口不变
# （dev 8000 / prod 20000、20443）。dev/prod 两形态共用本文件。
# 职责六件事：
#   ① 门户静态页/资产/mock（root 直出，与原默认行为一致）；
#   ② 全站干净 URL：根路径与 /admin/ 均支持无后缀自动补 .html
#      （/trial → trial.html、/my → my.html，/admin/appkeys → appkeys.html），
#      目录请求出 index（/admin/ → publish.html）；
#   ③ /v1/portal/* 门户只读数据端点 → 反代服务层（compose 网内 oneserve-service:8000；
#      仅门户数据面，无业务鉴权语义——与门户静态页同暴露级；前缀最长，优先于 ④）；
#   ④ /v1/* 其余业务 API（如试用台 /v1/tags/query）→ 反代网关（oneserve-apisix:9080，
#      走网关正式路由与 key-auth——与 9080 口完全同链路）；
#   ⑤ /demo* 演示通道 → 反代网关（oneserve-apisix:9080，走 init_routes 的 /demo* 正式
#      路由）；
#   ⑥ /v1/admin/* 运营管理端点（P0-4 凭证发放）→ 反代服务层（X-Admin-Token 校验在服务层）。
# 反代目标用变量＋resolver：Docker 内嵌 DNS(127.0.0.11) 请求期解析，portal 容器
# 先于 apisix/service 启动也不会因启动期解析失败而 crash-loop（不加 depends_on）。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen       8080;
    server_name  _;

    # ── http→https 跳转开关（蓝图 1a HTTPS 预留；dev 默认不跳＝下行保持注释） ──
    # 生产启用：取消下一行注释（8080 口即整体变 301 跳 8443），并确保 8443 块证书就位、
    # Casdoor 同源分流细目按下文 8443 块注释补齐（部署域名 1b 批定版时一并收口）。
    # return 301 https://$host$request_uri;

    root   /usr/share/nginx/html;
    index  index.html;

    # ⓪ P1-7 合并：原「联系与支持」独立页已下线，内容并入「帮助与支持」（/docs）——
    #    旧书签/外链不 404，301 到新页（两个入口都收：无后缀与 .html 各一条精确匹配）。
    #    用 $http_host（带端口）而非 $host（nginx 会剥端口），否则非 80 端口部署时重定向丢端口。
    location = /contact { return 301 $scheme://$http_host/docs; }
    location = /contact.html { return 301 $scheme://$http_host/docs; }

    # ① 静态优先（页面/mock/资产；不存在的路径如实 404，前端自有降级）
    #    无后缀干净 URL 回退到同名 .html（/trial → /trial.html），与 /admin/ 段同款
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ② 运营三页（admin/）：目录 index＋无后缀自动补 .html（/admin/ 目录不再 403）
    location /admin/ {
        index publish.html;
        try_files $uri $uri.html $uri/ =404;
    }

    # ③ 门户只读数据端点（首页/运行视图 KPI、目录、新鲜度、公告；前缀最长，优先于 /v1/）
    location /v1/portal/ {
        set $up_portal http://oneserve-service:8000;
        proxy_pass $up_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    # ③' 运营管理端点（P0-4：凭证列表/签发/禁用/热加载）→ 服务层（写操作由服务层
    #     校验 X-Admin-Token；前缀最长，优先于 /v1/ 的网关反代）
    location /v1/admin/ {
        set $up_admin http://oneserve-service:8000;
        proxy_pass $up_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        # P3-装载超时修复（2026-10-08）：大表装载（如 usr_asset_tag 100 万行）分钟级，
        # 默认 60s 读超时 → 504 HTML 打断前端（服务端仍继续跑完）——放宽到 600s。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ④ 业务 API → 网关（试用台 POST /v1/tags/query 等；key-auth 由网关执行，
    #    空 apikey 得真实 401——教学口径；/v1/portal/* 不受影响）
    location /v1/ {
        set $up_api http://oneserve-apisix:9080;
        proxy_pass $up_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        # P3-装载超时修复（2026-10-08）：与 /v1/admin/ 同口径放宽（装载链对齐）。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ⑤ 演示通道（试用台网页查询 POST /demo/query；经网关正式路由转发）
    location /demo {
        set $up_demo http://oneserve-apisix:9080;
        proxy_pass $up_demo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    # ⑥ Casdoor 同源分流（ADR-0018：登录页回原生白标·2026-10-19）
    #    白名单最小集：登录页/静态资源/会话 API/回调/个人中心；管理 API（add-user 等）
    #    一律不经门户放行。Casdoor 容器仅容器网内可达（19000 保持封死）。
    #    白标核销：JS 滤 'Powered by'（页脚硬编码）；HTML 注入品牌 CSS（背景图+
    #    隐藏「忘记密码」——维护者 已裁找回密码不做）；词图三文件返回透明图。

    # 门户自身静态优先（app.js/tokens.css/brand/* 等真实文件直出）；
    # 磁盘上不存在的（Casdoor 哈希束 index-*.js 等）转 Casdoor（@idp_assets 承载过滤）。
    # 教训（2026-10-19）：门户与 Casdoor 同用 /assets/ 命名空间，禁止整段反代。
    location ^~ /assets/ {
        try_files $uri @idp_assets;
    }
    location @idp_assets {
        set $up_idp http://oneserve-casdoor:8000;
        proxy_pass $up_idp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/javascript text/javascript;
        sub_filter_once off;
        sub_filter 'Powered by' '';
    }

    # 登录页与授权流入口（含 /login/oauth/authorize）；HTML 注入品牌 CSS。
    # 裸 /login（无查询参数）＝无应用上下文（连 built-in 组织，oneserve 用户会登录失败）
    # ——弹回 /login.html 引导壳走正确授权上下文（维护者 2026-10-20 实测踩坑）。
    location = /login {
        if ($is_args = "") { return 302 $scheme://$http_host/login.html; }
        set $up_idp http://oneserve-casdoor:8000;
        proxy_pass $up_idp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<style id="os-brand">.login-background{background:#F7F8FA url(/assets/brand/login-bg.png) center/cover no-repeat!important;font-family:-apple-system,Segoe UI,Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif!important;color:#1F2430!important}body{background:#F7F8FA!important}.login-topbar{padding:1rem 1.25rem!important}.login-topbar button{color:#6E7683!important;background:rgba(255,255,255,.72)!important;border:1px solid #E8EAEE!important;border-radius:9px!important;box-shadow:0 1px 2px rgba(31,36,48,.04)!important;transition:.18s!important}.login-topbar button:hover{background:#fff!important;color:#1F2430!important;box-shadow:0 2px 8px rgba(31,36,48,.08)!important}.login-content{padding-top:0!important;padding-bottom:0!important;align-items:center!important}.login-panel{position:relative!important;border:1px solid #E6E8EC!important;border-radius:18px!important;background:#fff!important;color:#1F2430!important;padding:2.4rem 2.5rem 2.2rem!important;box-shadow:0 32px 64px -32px rgba(31,36,48,.24),0 12px 28px -18px rgba(31,36,48,.12),0 1px 2px rgba(31,36,48,.04)!important}.login-panel::before{content:"";position:absolute;top:0;left:50%;width:44px;height:3px;margin-left:-22px;border-radius:0 0 3px 3px;background:#C8102E!important;opacity:.95}.login-logo-box{margin-bottom:1.15rem!important}.login-logo-box a{pointer-events:none!important}.login-logo-box img{width:246px!important;height:auto!important;max-width:100%!important;max-height:none!important;display:block!important}.login-form{padding-bottom:0!important}.login-form form>*+*{margin-top:.95rem!important}.login-username>*+*,.login-password>*+*{margin-top:.42rem!important}.login-form label{font-size:13px!important;font-weight:600!important;letter-spacing:.02em!important;color:#1F2430!important;transition:.18s!important}.login-username:focus-within label,.login-password:focus-within label{color:#C8102E!important}.login-form input:not([type=checkbox]){height:2.85rem!important;min-height:2.85rem!important;border:1px solid #DDE1E7!important;border-radius:10px!important;background:#FBFBFC!important;color:#1F2430!important;font-size:15px!important;padding:0 .9rem!important;box-shadow:inset 0 1px 2px rgba(31,36,48,.02)!important;transition:.18s!important}.login-form input:not([type=checkbox]):hover{border-color:#C9CED7!important}.login-form input:not([type=checkbox]):focus{outline:none!important;border-color:#C8102E!important;background:#fff!important;box-shadow:0 0 0 3px rgba(200,16,46,.1),inset 0 1px 2px rgba(31,36,48,.02)!important}.login-form input::placeholder{color:#9AA1AC!important;opacity:1!important}.login-password-input{padding-right:2.8rem!important}.login-password-input~button{color:#8A919C!important;border-radius:8px!important;transition:.18s!important}.login-password-input~button:hover{color:#1F2430!important;background:#F2F3F5!important}.login-form .login-button-box{margin-top:1.15rem!important}.login-button{background-color:#C8102E!important;color:#fff!important;height:2.9rem!important;min-height:2.9rem!important;border-radius:10px!important;font-size:15px!important;font-weight:600!important;letter-spacing:.22em!important;text-indent:.22em!important;box-shadow:0 8px 18px -10px rgba(200,16,46,.6)!important;transition:.18s!important}.login-button:hover{background-color:#A50D26!important;box-shadow:0 10px 22px -10px rgba(165,13,38,.65)!important}.login-button:active{background-color:#8F0B21!important;transform:translateY(1px)!important;box-shadow:0 4px 10px -6px rgba(165,13,38,.55)!important}.login-button:focus-visible{outline:none!important;box-shadow:0 0 0 3px rgba(200,16,46,.16),0 8px 18px -10px rgba(200,16,46,.6)!important}.login-forget-password{display:none!important}[class*=signup-link]{display:none!important}footer#footer{display:none!important}@media (max-width:640px){.login-panel{padding:2rem 1.4rem 1.8rem!important;border-radius:16px!important}.login-logo-box img{width:208px!important}.login-form input:not([type=checkbox]){font-size:16px!important}}</style></head>';
        sub_filter '<body>' '<body><script>(function(){var b=location.pathname;function c(){var p=location.pathname;if(p==="/apps"||(p==="/"&&b!=="/"))location.replace("/login.html")}window.addEventListener("popstate",c);var h=history.pushState;history.pushState=function(){h.apply(history,arguments);setTimeout(c,0)};var r=history.replaceState;history.replaceState=function(){r.apply(history,arguments);setTimeout(c,0)};c()})()</script>';  # ADR-0018 task-027 路由哨兵：SPA 内部路由到 /apps 时弹回引导壳
    }
    location ^~ /login/ {
        set $up_idp http://oneserve-casdoor:8000;
        proxy_pass $up_idp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<style id="os-brand">.login-background{background:#F7F8FA url(/assets/brand/login-bg.png) center/cover no-repeat!important;font-family:-apple-system,Segoe UI,Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif!important;color:#1F2430!important}body{background:#F7F8FA!important}.login-topbar{padding:1rem 1.25rem!important}.login-topbar button{color:#6E7683!important;background:rgba(255,255,255,.72)!important;border:1px solid #E8EAEE!important;border-radius:9px!important;box-shadow:0 1px 2px rgba(31,36,48,.04)!important;transition:.18s!important}.login-topbar button:hover{background:#fff!important;color:#1F2430!important;box-shadow:0 2px 8px rgba(31,36,48,.08)!important}.login-content{padding-top:0!important;padding-bottom:0!important;align-items:center!important}.login-panel{position:relative!important;border:1px solid #E6E8EC!important;border-radius:18px!important;background:#fff!important;color:#1F2430!important;padding:2.4rem 2.5rem 2.2rem!important;box-shadow:0 32px 64px -32px rgba(31,36,48,.24),0 12px 28px -18px rgba(31,36,48,.12),0 1px 2px rgba(31,36,48,.04)!important}.login-panel::before{content:"";position:absolute;top:0;left:50%;width:44px;height:3px;margin-left:-22px;border-radius:0 0 3px 3px;background:#C8102E!important;opacity:.95}.login-logo-box{margin-bottom:1.15rem!important}.login-logo-box a{pointer-events:none!important}.login-logo-box img{width:246px!important;height:auto!important;max-width:100%!important;max-height:none!important;display:block!important}.login-form{padding-bottom:0!important}.login-form form>*+*{margin-top:.95rem!important}.login-username>*+*,.login-password>*+*{margin-top:.42rem!important}.login-form label{font-size:13px!important;font-weight:600!important;letter-spacing:.02em!important;color:#1F2430!important;transition:.18s!important}.login-username:focus-within label,.login-password:focus-within label{color:#C8102E!important}.login-form input:not([type=checkbox]){height:2.85rem!important;min-height:2.85rem!important;border:1px solid #DDE1E7!important;border-radius:10px!important;background:#FBFBFC!important;color:#1F2430!important;font-size:15px!important;padding:0 .9rem!important;box-shadow:inset 0 1px 2px rgba(31,36,48,.02)!important;transition:.18s!important}.login-form input:not([type=checkbox]):hover{border-color:#C9CED7!important}.login-form input:not([type=checkbox]):focus{outline:none!important;border-color:#C8102E!important;background:#fff!important;box-shadow:0 0 0 3px rgba(200,16,46,.1),inset 0 1px 2px rgba(31,36,48,.02)!important}.login-form input::placeholder{color:#9AA1AC!important;opacity:1!important}.login-password-input{padding-right:2.8rem!important}.login-password-input~button{color:#8A919C!important;border-radius:8px!important;transition:.18s!important}.login-password-input~button:hover{color:#1F2430!important;background:#F2F3F5!important}.login-form .login-button-box{margin-top:1.15rem!important}.login-button{background-color:#C8102E!important;color:#fff!important;height:2.9rem!important;min-height:2.9rem!important;border-radius:10px!important;font-size:15px!important;font-weight:600!important;letter-spacing:.22em!important;text-indent:.22em!important;box-shadow:0 8px 18px -10px rgba(200,16,46,.6)!important;transition:.18s!important}.login-button:hover{background-color:#A50D26!important;box-shadow:0 10px 22px -10px rgba(165,13,38,.65)!important}.login-button:active{background-color:#8F0B21!important;transform:translateY(1px)!important;box-shadow:0 4px 10px -6px rgba(165,13,38,.55)!important}.login-button:focus-visible{outline:none!important;box-shadow:0 0 0 3px rgba(200,16,46,.16),0 8px 18px -10px rgba(200,16,46,.6)!important}.login-forget-password{display:none!important}[class*=signup-link]{display:none!important}footer#footer{display:none!important}@media (max-width:640px){.login-panel{padding:2rem 1.4rem 1.8rem!important;border-radius:16px!important}.login-logo-box img{width:208px!important}.login-form input:not([type=checkbox]){font-size:16px!important}}</style></head>';
        sub_filter '<body>' '<body><script>(function(){var b=location.pathname;function c(){var p=location.pathname;if(p==="/apps"||(p==="/"&&b!=="/"))location.replace("/login.html")}window.addEventListener("popstate",c);var h=history.pushState;history.pushState=function(){h.apply(history,arguments);setTimeout(c,0)};var r=history.replaceState;history.replaceState=function(){r.apply(history,arguments);setTimeout(c,0)};c()})()</script>';  # ADR-0018 task-027 路由哨兵：SPA 内部路由到 /apps 时弹回引导壳
    }

    # OAuth 回调页与个人中心（自助改密/资料·ADR-0018 D4-a）
    location = /callback {
        set $up_idp http://oneserve-casdoor:8000;
        proxy_pass $up_idp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
    }
    location ^~ /account {
        set $up_idp http://oneserve-casdoor:8000;
        proxy_pass $up_idp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
    }

    # 会话/登录页引导 API（netlog 实证启动必调；authorize 为 SPA 授权路由必调——
    # /login/oauth/authorize 前端路由实际经此 XHR 决策发码；JSON 无过滤；管理 API 不在此列）
    location ~ ^/api/(login|logout|login/oauth/authorize|get-app-login|get-account|get-application|get-organization-applications|get-init-admin-status|mfa/setup/(initiate|verify|enable)|delete-mfa|set-preferred-mfa)$ {
        set $up_idp http://oneserve-casdoor:8000;
        proxy_pass $up_idp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    # 首登表单提交后 Casdoor SPA 会落到自家 /apps——劫持回引导壳：
    # 此时会话已建，再走 authorize 触发 fastAutoSignin 静默 302 发码（enableAutoSignin）。
    location = /apps { return 302 $scheme://$http_host/login.html; }

    # 页脚词图三文件→透明图（配合 staticBaseUrl=门户入口后词图回源本站）
    location = /img/casdoor-logo_1185x256.png { alias /usr/share/nginx/html/assets/brand/transparent.png; }
    location = /img/casdoor-logo_1185x256_dark.png { alias /usr/share/nginx/html/assets/brand/transparent.png; }
    location = /img/casdoor.png { alias /usr/share/nginx/html/assets/brand/transparent.png; }
    # manifest 换自家（原指 Casdoor CDN）；favicon.ico 兜底
    location = /site/casdoor/manifest.json { alias /usr/share/nginx/html/assets/brand/manifest.json; }
    location = /favicon.ico { alias /usr/share/nginx/html/assets/brand/favicon.png; }
}

# ══════════════════════════════════════════════════════════════════════════
# HTTPS 预留 server 块（蓝图 1a 批 2026-10-20；1b 批随非 root 化改 8443 监听）：
# 证书路径引用，本批只预留不启用。
# 生效条件（三件齐）：① portal 容器挂载证书（compose 已预留 ./certs/dev → /etc/nginx/certs
# 只读位；dev 自签证书用 scripts/gen-dev-cert.sh 生成）；② 宿主端口映射（compose.prod.yml
# 已预留 127.0.0.1 回环位）；③ 上方 ：8080 块的跳转开关按需打开（dev 默认不跳）。
# 预留口径：本块只镜像静态与业务反代主干（①静态 ②/admin ③/ v1/portal ③'/v1/admin
# ④/v1 ⑤/demo）；Casdoor 同源分流细目（/login、/assets、/api/* 白名单与白标 sub_filter）
# 待部署域名 1b 批定版时从 ：8080 段镜像——避免双份维护漂移，启用前本块不承载登录流。
# 证书：/etc/nginx/certs/{fullchain,privkey}.pem（生产＝真 CA 签发；dev＝自签）。
server {
    listen       8443 ssl;
    server_name  _;

    ssl_certificate      /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key  /etc/nginx/certs/privkey.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    root   /usr/share/nginx/html;
    index  index.html;

    # ① 静态优先（同 ：8080 段：干净 URL 自动补 .html；/contact 301 归 :8080 段专管，
    #    此处不重复——test_docs_help_center 钉死该 301 恰好两条）
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ② 运营三页（同 ：8080 段）
    location /admin/ {
        index publish.html;
        try_files $uri $uri.html $uri/ =404;
    }

    # ③ 门户只读数据端点 → 服务层
    location /v1/portal/ {
        set $up_portal http://oneserve-service:8000;
        proxy_pass $up_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    # ③' 运营管理端点 → 服务层
    location /v1/admin/ {
        set $up_admin http://oneserve-service:8000;
        proxy_pass $up_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ④ 业务 API → 网关（key-auth 由网关执行，与 ：9080 完全同链路）
    location /v1/ {
        set $up_api http://oneserve-apisix:9080;
        proxy_pass $up_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ⑤ 演示通道 → 网关
    location /demo {
        set $up_demo http://oneserve-apisix:9080;
        proxy_pass $up_demo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
}
